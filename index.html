<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선부고 세계 전통놀이 랭킹전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { font-family: 'Pretendard', sans-serif; }
        .digital-clock { font-family: monospace; letter-spacing: 2px; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-900 text-white py-6 px-4 shadow-lg mb-8">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-indigo-300 font-semibold text-sm tracking-wider">다문화 어울림 도서관 축제</span>
                <h1 class="text-3xl font-extrabold flex items-center gap-3 mt-1">
                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    선부고 세계 전통놀이 랭킹전
                </h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="syncBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                    동기화 연결 중...
                </span>
                <button onclick="toggleBillboard()" class="px-4 py-2 bg-indigo-700 hover:bg-indigo-600 rounded-lg text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-desktop"></i> 전광판 모드
                </button>
                <button onclick="exportToCSV()" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-600 rounded-lg text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> CSV 저장
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Stopwatch & Register Section -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-stopwatch text-indigo-600"></i> 스톱워치 (Enter 키 지원)
                </h2>
                
                <div class="bg-slate-900 rounded-xl p-6 text-center text-white mb-6">
                    <div id="timerDisplay" class="digital-clock text-5xl font-extrabold text-amber-400 mb-2">00:00.00</div>
                    <p id="timerStatus" class="text-xs text-slate-400">Enter 키를 눌러 시작 / 정지</p>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button id="startStopBtn" onclick="toggleTimer()" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                        <i id="startStopIcon" class="fa-solid fa-play"></i>
                        <span id="startStopText">시작 (Enter)</span>
                    </button>
                    <button onclick="resetTimer()" class="py-3 px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> 리셋
                    </button>
                </div>

                <!-- Registration Form -->
                <form id="recordForm" onsubmit="handleManualSubmit(event)" class="space-y-4 pt-4 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">종목 선택</label>
                        <select id="gameSelect" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="tangram">🧩 칠교놀이 (Tangram)</option>
                            <option value="matryoshka">🪆 마트료시카 (Matryoshka)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">학번 (5자리, 예: 10305)</label>
                        <input type="text" id="studentId" maxlength="5" placeholder="10305" required pattern="\d{5}" title="5자리 숫자 학번을 입력하세요" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">이름</label>
                        <input type="text" id="studentName" placeholder="홍길동" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">기록 (초 단위 / 수동 입력 가능)</label>
                        <input type="number" step="0.01" id="recordTimeInput" placeholder="예: 12.34" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> 기록 등록하기
                    </button>
                </form>
            </div>
        </section>

        <!-- Leaderboard Section -->
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-list-ol text-indigo-600"></i> 실시간 명예의 전당
                        <span class="text-xs font-normal text-slate-400 ml-1">(학생별 최단 기록만 표시)</span>
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="filterLeaderboard('both')" id="btnFilterBoth" class="px-3 py-1.5 bg-indigo-100 text-indigo-700 font-bold rounded-lg text-xs">전체</button>
                        <button onclick="filterLeaderboard('tangram')" id="btnFilterTangram" class="px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg text-xs">칠교놀이</button>
                        <button onclick="filterLeaderboard('matryoshka')" id="btnFilterMatryoshka" class="px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg text-xs">마트료시카</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Tangram Table -->
                    <div id="tangramBoard" class="space-y-3">
                        <h3 class="font-bold text-sm text-indigo-900 border-b pb-2 flex items-center justify-between">
                            <span>🧩 칠교놀이 TOP 10</span>
                            <span class="text-xs text-slate-400 font-normal">최단 시간순</span>
                        </h3>
                        <div id="tangramList" class="space-y-2">
                            <!-- JS Generated -->
                        </div>
                    </div>

                    <!-- Matryoshka Table -->
                    <div id="matryoshkaBoard" class="space-y-3">
                        <h3 class="font-bold text-sm text-indigo-900 border-b pb-2 flex items-center justify-between">
                            <span>🪆 마트료시카 TOP 10</span>
                            <span class="text-xs text-slate-400 font-normal">최단 시간순</span>
                        </h3>
                        <div id="matryoshkaList" class="space-y-2">
                            <!-- JS Generated -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Billboard Fullscreen Overlay -->
    <div id="billboardOverlay" class="fixed inset-0 bg-slate-950 text-white z-50 hidden flex-col p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <span class="text-amber-400 font-semibold text-lg">다문화 어울림 도서관 축제</span>
                <h1 class="text-4xl font-extrabold">선부고 세계 전통놀이 랭킹전 (실시간 전광판)</h1>
            </div>
            <button onclick="toggleBillboard()" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition text-lg">
                <i class="fa-solid fa-xmark"></i> 닫기 (ESC)
            </button>
        </div>
        <div class="grid grid-cols-2 gap-8 flex-1">
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-2xl font-bold text-amber-400 mb-4 pb-2 border-b border-slate-800">🧩 칠교놀이 실시간 랭킹</h2>
                <div id="billboardTangramList" class="space-y-3"></div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-2xl font-bold text-emerald-400 mb-4 pb-2 border-b border-slate-800">🪆 마트료시카 실시간 랭킹</h2>
                <div id="billboardMatryoshkaList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Firebase App Logic -->
    <script>
        // ⚠️ [중요] 아래 firebaseConfig 객체를 파이어베이스의 실제 키로 넣어주세요.
        const firebaseConfig = {
            apiKey: "AIzaSyCQgkkmnQesbH4C980JbxQTEryy2Mj2qCY",
            authDomain: "ranking-223cd.firebaseapp.com",
            projectId: "ranking-223cd",
            storageBucket: "ranking-223cd.firebasestorage.app",
            messagingSenderId: "88029652941",
            appId: "1:88029652941:web:568d757f4a020fbe618684",
            measurementId: "G-VPNLQ1YQ3P"
        };

        let db = null;
        let records = [];

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            
            // Anonymous Auth
            firebase.auth().signInAnonymously().then(() => {
                updateSyncStatus(true, "🟢 실시간 다중 기기 연동 중");
                subscribeRealtime();
            }).catch(err => {
                console.error("Auth Error:", err);
                updateSyncStatus(false, "🟡 로컬 저장 모드");
                loadLocalRecords();
            });
        } catch(e) {
            console.error("Firebase Init Error:", e);
            updateSyncStatus(false, "🟡 로컬 저장 모드");
            loadLocalRecords();
        }

        function updateSyncStatus(isOnline, message) {
            const badge = document.getElementById('syncBadge');
            if (isOnline) {
                badge.className = "inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> ${message}`;
            } else {
                badge.className = "inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> ${message}`;
            }
        }

        // Realtime Subscription
        function subscribeRealtime() {
            db.collection('records').onSnapshot(snapshot => {
                records = [];
                snapshot.forEach(doc => {
                    records.push({ id: doc.id, ...doc.data() });
                });
                renderLeaderboards();
            }, err => {
                console.error("Firestore Subscribe Error:", err);
            });
        }

        function loadLocalRecords() {
            const saved = localStorage.getItem('sunbo_records');
            records = saved ? JSON.parse(saved) : [];
            renderLeaderboards();
        }

        function saveLocalRecords() {
            localStorage.setItem('sunbo_records', JSON.stringify(records));
            renderLeaderboards();
        }

        // 💡 핵심: 동일 학번(studentId) 중복 제거 및 최고 기록(최단 시간)만 필터링
        function getDeduplicatedBestRecords(gameType) {
            const filtered = records.filter(r => r.game === gameType);
            const bestMap = {};

            filtered.forEach(rec => {
                const key = rec.studentId || rec.name; // 학번 기준
                const timeVal = parseFloat(rec.time);

                if (!bestMap[key] || timeVal < parseFloat(bestMap[key].time)) {
                    bestMap[key] = rec;
                }
            });

            return Object.values(bestMap).sort((a, b) => parseFloat(a.time) - parseFloat(b.time));
        }

        // Render Leaderboards
        function renderLeaderboards() {
            const tangramBest = getDeduplicatedBestRecords('tangram');
            const matryoshkaBest = getDeduplicatedBestRecords('matryoshka');

            renderList('tangramList', tangramBest.slice(0, 10));
            renderList('matryoshkaList', matryoshkaBest.slice(0, 10));
            
            renderBillboardList('billboardTangramList', tangramBest.slice(0, 10));
            renderBillboardList('billboardMatryoshkaList', matryoshkaBest.slice(0, 10));
        }

        function renderList(elementId, listData) {
            const container = document.getElementById(elementId);
            if (listData.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">등록된 기록이 없습니다.</p>`;
                return;
            }

            container.innerHTML = listData.map((item, idx) => {
                let medal = `<span class="w-6 font-bold text-slate-400 text-sm">${idx + 1}</span>`;
                if (idx === 0) medal = `<span class="w-6 text-amber-500 font-bold"><i class="fa-solid fa-crown"></i></span>`;
                else if (idx === 1) medal = `<span class="w-6 text-slate-400 font-bold"><i class="fa-solid fa-medal"></i></span>`;
                else if (idx === 2) medal = `<span class="w-6 text-amber-700 font-bold"><i class="fa-solid fa-award"></i></span>`;

                return `
                    <div class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-lg text-sm transition">
                        <div class="flex items-center gap-2">
                            ${medal}
                            <span class="font-bold text-slate-700">${item.studentId || ''} ${item.name}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="digital-clock font-extrabold text-indigo-600">${parseFloat(item.time).toFixed(2)}초</span>
                            <button onclick="deleteRecord('${item.id}')" class="text-slate-300 hover:text-red-500 text-xs transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderBillboardList(elementId, listData) {
            const container = document.getElementById(elementId);
            if (listData.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8">기록 대기 중...</p>`;
                return;
            }

            container.innerHTML = listData.map((item, idx) => {
                let rankStyle = "text-slate-400";
                if (idx === 0) rankStyle = "text-amber-400 text-xl font-black";
                else if (idx === 1) rankStyle = "text-slate-300 text-lg font-bold";
                else if (idx === 2) rankStyle = "text-amber-600 text-lg font-bold";

                return `
                    <div class="flex items-center justify-between p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <div class="flex items-center gap-4">
                            <span class="w-8 ${rankStyle}">${idx + 1}</span>
                            <span class="font-bold text-lg text-slate-200">${item.studentId || ''} ${item.name}</span>
                        </div>
                        <span class="digital-clock text-2xl font-extrabold text-amber-400">${parseFloat(item.time).toFixed(2)}s</span>
                    </div>
                `;
            }).join('');
        }

        // Add Record
        async function addRecord(game, studentId, name, time) {
            const recordData = {
                game,
                studentId,
                name,
                time: parseFloat(time).toFixed(2),
                createdAt: new Date().toISOString()
            };

            if (db) {
                await db.collection('records').add(recordData);
            } else {
                records.push({ id: Date.now().toString(), ...recordData });
                saveLocalRecords();
            }
        }

        async function deleteRecord(id) {
            if (!confirm('이 기록을 삭제하시겠습니까?')) return;
            if (db) {
                await db.collection('records').doc(id).delete();
            } else {
                records = records.filter(r => r.id !== id);
                saveLocalRecords();
            }
        }

        function handleManualSubmit(e) {
            e.preventDefault();
            const game = document.getElementById('gameSelect').value;
            const studentId = document.getElementById('studentId').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const time = document.getElementById('recordTimeInput').value;

            if (studentId.length !== 5) {
                alert('학번은 5자리 숫자로 입력해 주세요 (예: 10305)');
                return;
            }

            addRecord(game, studentId, name, time);
            
            document.getElementById('studentId').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('recordTimeInput').value = '';
            alert('기록이 등록되었습니다!');
        }

        // Timer Logic
        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;
        let isRunning = false;

        function toggleTimer() {
            if (isRunning) {
                // Stop
                clearInterval(timerInterval);
                isRunning = false;
                document.getElementById('startStopText').innerText = '시작 (Enter)';
                document.getElementById('startStopIcon').className = 'fa-solid fa-play';
                
                // Auto fill time into input
                const finalSeconds = (elapsedTime / 1000).toFixed(2);
                document.getElementById('recordTimeInput').value = finalSeconds;
            } else {
                // Start
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    updateTimerDisplay(elapsedTime);
                }, 10);
                isRunning = true;
                document.getElementById('startStopText').innerText = '정지 (Enter)';
                document.getElementById('startStopIcon').className = 'fa-solid fa-pause';
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            updateTimerDisplay(0);
            document.getElementById('startStopText').innerText = '시작 (Enter)';
            document.getElementById('startStopIcon').className = 'fa-solid fa-play';
            document.getElementById('recordTimeInput').value = '';
        }

        function updateTimerDisplay(timeMs) {
            const totalSec = Math.floor(timeMs / 1000);
            const mins = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const secs = (totalSec % 60).toString().padStart(2, '0');
            const ms = Math.floor((timeMs % 1000) / 10).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}.${ms}`;
        }

        // Enter key shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                toggleTimer();
            }
        });

        // UI Helpers
        function toggleBillboard() {
            const overlay = document.getElementById('billboardOverlay');
            overlay.classList.toggle('hidden');
            overlay.classList.toggle('flex');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('billboardOverlay').classList.add('hidden');
                document.getElementById('billboardOverlay').classList.remove('flex');
            }
        });

        function filterLeaderboard(type) {
            const tangramBoard = document.getElementById('tangramBoard');
            const matryoshkaBoard = document.getElementById('matryoshkaBoard');
            
            if (type === 'tangram') {
                tangramBoard.classList.remove('hidden');
                matryoshkaBoard.classList.add('hidden');
            } else if (type === 'matryoshka') {
                tangramBoard.classList.add('hidden');
                matryoshkaBoard.classList.remove('hidden');
            } else {
                tangramBoard.classList.remove('hidden');
                matryoshkaBoard.classList.remove('hidden');
            }
        }

        // Export CSV
        function exportToCSV() {
            if (records.length === 0) {
                alert('내보낼 데이터가 없습니다.');
                return;
            }

            let csvContent = "\uFEFF종목,학번,이름,소요시간(초),등록일시\n";
            records.forEach(r => {
                const gameName = r.game === 'tangram' ? '칠교놀이' : '마트료시카';
                csvContent += `"${gameName}","${r.studentId || ''}","${r.name}","${r.time}","${r.createdAt || ''}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `선부고_전통놀이_전체기록_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }
    </script>
</body>
</html>
